<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0B3C5D" />
  <title>NORUS APARTMENTS</title>
  <!-- Google Fonts - Cargados vía CSS para mejor rendimiento en web -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=EB+Garamond:wght@400;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Registrar fuentes con los mismos nombres que usa el tema */
    @font-face {
      font-family: 'CormorantSC_700Bold';
      src: local('Cormorant SC'), url('https://fonts.gstatic.com/s/cormorantsc/v13/SlGXw2ouS_tL3AqG6TYXG8DDNw.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'CormorantSC_600SemiBold';
      src: local('Cormorant SC'), url('https://fonts.gstatic.com/s/cormorantsc/v13/SlGXw2ouS_tL3AqG6TYXG8DDNw.woff2') format('woff2');
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: 'EBGaramond_600SemiBold';
      src: local('EB Garamond'), url('https://fonts.gstatic.com/s/ebgaramond/v24/zrXf0RZViMoYz3c3xWU.woff2') format('woff2');
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: 'EBGaramond_400Regular';
      src: local('EB Garamond'), url('https://fonts.gstatic.com/s/ebgaramond/v24/zrXf0RZViMoYz3c3xWU.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Lato_400Regular';
      src: local('Lato'), url('https://fonts.gstatic.com/s/lato/v24/S6uyw4BMUTPHjxAwXjeu.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Lato_700Bold';
      src: local('Lato'), url('https://fonts.gstatic.com/s/lato/v24/S6u9w4BMUTPHh6UVSwiPGQ.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
    /* Fallback a fuentes del sistema si fallan las de Google */
    body {
      font-family: 'Lato_400Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    #root {
      height: 100vh;
      width: 100vw;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.web.js"></script>
</body>
</html>
