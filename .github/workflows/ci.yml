name: CI — Grupo Norus

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del sistema (mysqlclient)
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Django check (settings CI)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
          SECRET_KEY: ci-secret-key
        run: python manage.py check

      - name: Migraciones (SQLite en CI)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
          SECRET_KEY: ci-secret-key
        run: python manage.py migrate --noinput

      - name: Tests (pytest)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
          SECRET_KEY: ci-secret-key
        run: pytest -q

  backend-docker-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen Docker
        run: docker build -t gruponorus-backend:ci ./backend

      # Fase 1: agregar login a Amazon ECR y push de la imagen
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-region: us-east-1
      #     role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      # - uses: aws-actions/amazon-ecr-login@v2
      # - run: |
      #     docker tag gruponorus-backend:ci $ECR_REGISTRY/gruponorus-backend:${{ github.sha }}
      #     docker push $ECR_REGISTRY/gruponorus-backend:${{ github.sha }}

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Fase 2: build del panel web para S3 + CloudFront
      # - run: npx expo export --platform web
